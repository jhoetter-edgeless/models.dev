base_model = "meta/muse-spark-1.1"
description = "Muse Spark 1.1 is strongest at agentic performance, tool use, and computer use. It does well on long-running tasks with a 1M-token context window and can delegate execution to sub-agents running in parallel."
structured_output = false

[[reasoning_options]]
type = "effort"
values = ["none", "minimal", "low", "medium", "high"]

[cost]
input = 1.25
output = 4.25
reasoning = 0
cache_read = 0.15

[limit]
context = 1_048_576
output = 1_048_576

[modalities]
input = ["text", "image"]
